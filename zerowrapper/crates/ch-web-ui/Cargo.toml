[package]
name = "ch-web-ui"
version = "0.1.0"
edition.workspace = true

[lib]
name = "ch_web_ui"

[dependencies]
tokio = { workspace = true }
zw-core = { path = "../../zw-core" }
zw-db = { path = "../../zw-db" }
zw-cache = { path = "../../zw-cache" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = "0.3"
tracing = { workspace = true }
chrono = { workspace = true }
mime_guess = { workspace = true }
topcoat = { path = "../../../topcoat/crates/topcoat", default-features = false, features = [
    "view",
    "router",
    "asset",
    "tailwind",
    "font-fontsource",
    "icon-iconify",
    "ui",
    "discover",
    "serve",
    "websocket",
] }

[build-dependencies]
topcoat = { path = "../../../topcoat/crates/topcoat", default-features = false, features = [
    "icon-iconify",
    "tailwind",
] }

[lints.rust]
unused = "warn"
dead_code = "allow"
